<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 斗地主擂台赛</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="su0" viewBox="0 0 100 100"><path d="M50 5C35 25 8 40 8 60c0 14 11 22 22 22 8 0 14-4 17-9-1 9-5 17-12 22h30c-7-5-11-13-12-22 3 5 9 9 17 9 11 0 22-8 22-22C92 40 65 25 50 5Z"/></symbol>
  <symbol id="su1" viewBox="0 0 100 100"><path d="M50 90C20 66 5 51 5 31 5 16 17 6 30 6c10 0 17 6 20 13 3-7 10-13 20-13 13 0 25 10 25 25 0 20-15 35-45 59Z"/></symbol>
  <symbol id="su2" viewBox="0 0 100 100"><circle cx="50" cy="27" r="20"/><circle cx="27" cy="58" r="20"/><circle cx="73" cy="58" r="20"/><path d="M45 50h10c0 22 4 33 13 45H32c9-12 13-23 13-45Z"/></symbol>
  <symbol id="su3" viewBox="0 0 100 100"><path d="M50 3 90 50 50 97 10 50Z"/></symbol>
  <symbol id="star" viewBox="0 0 100 100"><path d="M50 4 62 37h35L69 58l11 34-30-21-30 21 11-34L3 37h35Z"/></symbol>
</svg>
<div id="viewport">
<div id="stage">
<div id="cam">
  <div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div><div class="pulse"></div></div>

  <!-- 顶栏 -->
  <header id="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
          <rect x="6" y="4" width="20" height="28" rx="4" fill="url(#lg)" transform="rotate(-12 16 18)"/>
          <rect x="14" y="8" width="20" height="28" rx="4" fill="#fff" stroke="#ffb347" stroke-width="1.5" transform="rotate(10 24 22)"/>
          <text x="24" y="27" font-size="13" font-weight="900" fill="#e53950" text-anchor="middle" transform="rotate(10 24 22)">AI</text></svg>
      </div>
      <div>
        <div class="title">AI 斗地主擂台赛</div>
        <div class="subtitle">每局淘汰一人 · 赢家守擂</div>
      </div>
      <div class="live"><span></span>LIVE</div>
    </div>
    <div class="center-info">
      <div class="pill"><label>局数</label><b id="gameNo">-</b></div>
      <div class="bottom-wrap"><label>底牌</label><div id="bottom" class="cards mini"></div></div>
      <div class="pill"><label>底分</label><b id="bid">-</b></div>
      <div class="pill mult"><label>倍数</label><b id="mult">×1</b></div>
    </div>
    <div class="right-info">
      <div id="phase">等待开局</div>
      <button id="bgm" class="tbtn" title="背景音乐开关">音乐 开</button>
      <button id="sound" class="tbtn" title="音效开关">音效 开</button>
    </div>
  </header>

  <!-- 牌桌 -->
  <main id="table">
    <div class="felt"><div class="felt-inner"></div><div class="watermark">AI 斗地主</div></div>
    <div id="turnHint"></div>

    <section class="seat" id="seat0" data-pos="left"></section>
    <section class="seat" id="seat1" data-pos="right"></section>
    <section class="seat" id="seat2" data-pos="bottom"></section>

    <div class="played" id="played0"></div>
    <div class="played" id="played1"></div>
    <div class="played" id="played2"></div>

    <div class="bubble" id="bubble0"></div>
    <div class="bubble" id="bubble1"></div>
    <div class="bubble" id="bubble2"></div>
  </main>

  <!-- 侧栏 -->
  <aside id="side">
    <div class="panel">
      <h3><span class="ico"></span>排行榜</h3>
      <div id="rank"></div>
    </div>
    <div class="panel">
      <h3><span class="ico"></span>挑战者队列</h3>
      <div id="queue"></div>
    </div>
    <div class="panel grow">
      <h3><span class="ico"></span>实时战况</h3>
      <div id="feed"></div>
    </div>
  </aside>

  <div id="vig"></div>
  <div id="overlay"></div>
  <canvas id="fxc" width="1920" height="1080"></canvas>
  <div id="fx"></div>
</div>
</div>
</div>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
